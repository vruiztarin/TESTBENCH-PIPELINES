name: Gestion de arfectos
on:
  push:

jobs:
  crear-carpeta:
    runs-on: ubuntu-latest
    steps:
      - run: |
            echo "Inicio de cracion de carpeta."
            mkdir resultados
            echo "Prueba en la primera linea" > prueba.txt
            echo "Prueba de la segunda linea" >> prueba.txt
            ls
            cat prueba.txt
            mv prueba.txt resultados/
  descargar-carpeta:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/upload-artifact@v4
        with:
          name: prueba.txt
          path: resultados/


            
      