name: Lint workflows
on:
  push:
    branches:
      - main

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v2
      - uses: cschleiden/actions-linter@v1
        with:
          workflows: '[".github/workflows/*.yaml"]'
      - run: |
            echo "Revision finalizada"
            echo "Hello world! ${{ github.does-not-exit }}""
      